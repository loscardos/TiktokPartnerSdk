        description: "The product audit status. Possible values: * NONE: The product is not applicable for audit because it has not been submitted for listing on this platform, or it is in a draft, frozen, or deactivated state. * AUDITING: The product is currently being audited. * FAILED: The product failed the audit, or the audit was cancelled. * PRE_APPROVED: The product has passed the audit but is not yet listed due to pending prerequisites. Refer to pre_approved_reasons for the prerequisites. * APPROVED: The product passed the audit and has been listed on the platform."
