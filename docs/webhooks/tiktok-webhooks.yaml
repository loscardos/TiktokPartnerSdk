        data_type: "int"
        sample: "21"
        description: "When alert_type == PREDICTION, the value is the time slot between update_time and the predicted out-of-stock date. When alert_type == REALTIME, the parameter is not returned."
      - path: "data.trigger_reason.low_stock_threshold"
        data_type: "int"
        sample: "0"
        description: "When alert_type == REALTIME, the value is the low stock threshold met. When alert_type == PREDICTION, the parameter is not returned."
      - path: "data.current_inventory_status"
