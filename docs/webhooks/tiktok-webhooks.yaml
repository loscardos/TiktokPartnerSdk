    raw_markdown: |
      
      ### What is changing?
      TikTok Shop is launching a new Inventory changed webhook to push real-time events for SKU inventory quantity changes. Previously, developers had to indirectly infer inventory changes by subscribing to multiple webhook messages (e.g., order creation, marketing campaigns), which was complex and error-prone.
      The new Inventory changed webhook standardizes inventory change notifications. Whether caused by new order creation, order cancellation, manual seller adjustments, API calls, or inventory locking/releasing from marketing campaigns or creator collaborations, the system will push real-time messages with a unified structure via this webhook.
      This will help developers and service providers synchronize product inventory more accurately and efficiently, avoiding overselling or stockout issues caused by inventory information delays or inconsistencies, and simplifying inventory management logic.
      ### Which markets are affected?
      This change applies to all markets.
      ### Who is affected?
      This change applies to all developers integrated with TikTok Shop APIs.
      ### Which version is applicable?
      This is a new webhook push event and does not involve API version changes. Messages will be pushed to the webhook URL configured in the developer's application.
      ### What action is required?
      It is highly recommended to integrate this webhook into your application so that your merchants can benefit from more real-time two-way inventory synchronization. Once implemented, you can more reliably track inventory changes on the TikTok Shop platform.
      Detailed protocol and field descriptions for this webhook can be found in the technical details below.
      
      ### Technical Details
      #### Trigger Conditions
      The Inventory changed webhook will be triggered when any of the following events cause SKU inventory quantity changes:
      
      * `order_created`: Order successfully placed, inventory is committed.
      * `order_canceled`: Order canceled by user or seller, committed inventory is released back to available stock.
      * `order_shipped`: Order shipped, committed inventory is deducted.
      * `manual_adjustment`: Seller manually modifies inventory in Seller Center.
      * `api_sync`: Developer updates inventory via inventory-related OpenAPIs.
      * `campaign_lock`: Seller signs up for platform marketing campaigns, part of the inventory is locked.
      * `campaign_unlock`: Marketing campaign ends or seller withdraws, locked inventory is released.
      * `creator_lock`: Seller establishes collaboration with a creator, allocating exclusive inventory.
      * `creator_unlock`: Collaboration with creator ends, locked inventory is released.
      * `system_auto_replenish`: System automatically replenishes inventory (e.g., order failure due to exceptions).
      
      #### Payload Structure
      The payload for each inventory update push includes common event information, the post-change inventory snapshot, and specific change details.
      | **Field Name** | **Type** | **Required** | **Description** |
      | --- | --- | --- | --- |
      | `event_id` | String | Yes | Unique identifier for the event, can be used for event-level idempotency. |
      | `occurred_at` | String | Yes | Time when the event occurred (UTC+0), in ISO 8601 format. |
      | `seller_id` | int64 | Yes | Seller ID. |
      | `product_id` | int64 | Yes | Product ID. |
      | `sku_id` | int64 | Yes | SKU ID where the inventory change occurred. |
      | **quantity_snapshot_after_change (Object)**: Post-change SKU inventory snapshot |  |  |  |
      | ` total_quantity` | Integer | Yes | Total warehouse inventory. Equals `total_available_quantity` + `total_committed_quantity`. |
      | ` total_available_quantity` | Integer | Yes | Available warehouse inventory. Total inventory physically present in the warehouse and available for sale. |
      | ` total_committed_quantity` | Integer | Yes | Committed order inventory. Inventory that has been ordered by users but not yet shipped. |
      | ` in_shop_quantity` | Integer | Yes | In-shop available inventory. Available stock currently not locked by any orders, campaigns, or creators. Equals `total_available_quantity` - (`campaign_locked_quantity` + `creator_locked_quantity`). |
      | ` campaign_locked_quantity` | Integer | Yes | Inventory locked by marketing campaigns. |
      | ` creator_locked_quantity` | Integer | Yes | Inventory locked by creator collaborations. |
      | **change_detail (List<Object>)**: List of inventory change details. In most cases, this list contains only one object. |  |  |  |
      | ` idempotency_key` | String | Yes | Unique identifier for a single change operation, can be used for detail-level idempotency. |
      | ` trigger_source` | String | Yes | Reason for the inventory change, corresponding to the Trigger Condition Code above. |
      | ` occurred_at` | String | Yes | Time when the specific change event occurred (UTC+0). Can be used to ensure sequential processing. |
      | ` total_quantity_delta` | Integer | Yes | Change amount for total warehouse inventory. |
      | ` available_quantity_delta` | Integer | Yes | Change amount for available warehouse inventory. |
      | ` committed_quantity_delta` | Integer | Yes | Change amount for committed order inventory. |
      | ` in_shop_quantity_delta` | Integer | Yes | Change amount for in-shop available inventory. |
      | ` campaign_locked_quantity_delta` | Integer | Yes | Change amount for marketing campaign locked inventory. |
      | ` creator_locked_quantity_delta` | Integer | Yes | Change amount for creator collaboration locked inventory. |
      **Note: For all delta fields, positive numbers represent increases, and negative numbers represent decreases.**
      #### Example Payload
      The following is an example of a Webhook payload when a seller manually increases the inventory of an SKU by 4 units through the Seller Center:
