        data_type: "object"
        sample: ""
        description: ""
      - path: "data.trigger_reason.alert_type"
        data_type: "string"
        sample: "\"PREDICTION\""
        description: "PREDICTION: TikTok Shop predicts the inventory will go out of stock in X days REALTIME: The inventory has reached LOW_STOCK or OUT_OF_STOCK"
