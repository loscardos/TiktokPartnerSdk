        sample: "50"
        description: "The total number of SKUs available for ordering in the warehouses."
      - path: "data.inventory_distribution.creator_reserved_quantity"
        data_type: "int"
        sample: "20"
        description: "The total number of SKUs reserved for creators in the warehouses."
      - path: "data.inventory_distribution.campaign_reserved_quantity"
        data_type: "int"
        sample: "20"
        description: "The total number of SKUs reserved for campaigns in the warehouses."
      - path: "data.inventory_distribution.committed_quantity"
        data_type: "int"
        sample: "10"
